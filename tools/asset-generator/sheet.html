<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Planche de design</title>
    <style>
      html, body { margin: 0; background: #e8e2d4; color: #2a241c; font-family: system-ui, sans-serif; }
      #sheet { position: relative; width: 1800px; height: 1100px; overflow: hidden; }
      #side { position: absolute; left: 0; top: 0; bottom: 0; width: 400px; padding: 36px 32px; box-sizing: border-box; background: #2a241c; color: #efe8d8; }
      #side .kicker { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #b9ab8c; margin: 0 0 6px; }
      #side h1 { font-size: 40px; line-height: 1.05; margin: 0 0 8px; }
      #side .gang { display: inline-block; font-weight: 600; font-size: 15px; padding: 4px 10px; border-radius: 4px; margin-bottom: 18px; }
      #side h2 { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #b9ab8c; margin: 22px 0 8px; }
      #side p, #side li { font-size: 15px; line-height: 1.45; margin: 0 0 6px; }
      #side ul { padding-left: 18px; margin: 0; }
      .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
      .swatch { width: 52px; font-size: 10px; color: #b9ab8c; text-align: center; }
      .swatch i { display: block; height: 36px; border-radius: 4px; margin-bottom: 3px; border: 1px solid rgba(255,255,255,0.15); }
      #side .foot { position: absolute; left: 32px; right: 32px; bottom: 28px; font-size: 12px; color: #8d8169; }
      #views { position: absolute; left: 400px; top: 0; right: 0; bottom: 0; }
      canvas { display: block; }
      .label { position: absolute; background: rgba(232, 226, 212, 0.9); padding: 3px 8px; border-radius: 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #6d6150; }
      .label small { font-weight: 400; letter-spacing: 0; text-transform: none; color: #8d8169; margin-left: 6px; }
      .cell { position: absolute; border: 1px solid rgba(42, 36, 28, 0.14); box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="sheet">
      <aside id="side"></aside>
      <div id="views"></div>
    </div>
    <script type="module" src="/src/sheet.js"></script>
  </body>
</html>
